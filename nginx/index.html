<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Java Calculator — Deployment Status</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 48px 56px;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .badge {
            display: inline-block;
            background: #22c55e22;
            color: #22c55e;
            border: 1px solid #22c55e55;
            border-radius: 999px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 32px; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 32px;
        }
        .info-item {
            background: #0f172a;
            border-radius: 10px;
            padding: 16px;
            text-align: left;
        }
        .info-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .info-value { font-size: 14px; font-weight: 600; color: #e2e8f0; }
        .footer { font-size: 12px; color: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">● RUNNING</div>
        <h1>Basic Java Calculator</h1>
        <p class="subtitle">SPE Mini-Project — Docker Compose Deployment</p>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Service</div>
                <div class="info-value">java-calculator</div>
            </div>
            <div class="info-item">
                <div class="info-label">Version</div>
                <div class="info-value">1.0-SNAPSHOT</div>
            </div>
            <div class="info-item">
                <div class="info-label">Proxy</div>
                <div class="info-value">Nginx:alpine</div>
            </div>
            <div class="info-item">
                <div class="info-label">Network</div>
                <div class="info-value">calculator-net</div>
            </div>
        </div>
        <p class="footer">CSE 816 · Software Production Engineering Mid-Term project</p>
    </div>
</body>
</html>
